<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>Owner report · Avira Stays</title>
<style>
:root{
  --navy:#081C40; --ink:#2D3F4D; --ink-soft:#5E6F7A; --ink-faint:rgba(45,63,77,.58);
  --maroon:#7A1E24; --star:#EF923A;
  --bg:#F7F1E4; --paper:#FFFDF8; --cream:#FAF6F0; --sand:#EAD9B7;
  --line:rgba(45,63,77,.14); --line-firm:rgba(45,63,77,.26);
  --you:#2F5FA7; --you-soft:#C9D6EC; --avira:#C8620F; --fees:#B9B1A3; --occ:#1F8A6C;
  --ledger:#242220; --ledger-2:#332F2A; --ledger-ink:#F1E9D8; --gold:#C9A24E;
  --good-bg:#E3EEDD; --good-fg:#2F5C34; --warn-bg:#F6E7C8; --warn-fg:#7A5310;
  --f-display:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --f-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}
h1,h2,h3{font-family:var(--f-display);color:var(--navy);font-weight:600;line-height:1.2;margin:0}
p{margin:0}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}
button,input{font:inherit}
:focus-visible{outline:2px solid var(--star);outline-offset:2px}

/* lock screen */
.lock{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lock-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;max-width:400px;width:100%;padding:32px 24px;box-shadow:0 12px 40px rgba(8,28,64,.08)}
.lock-card img{width:170px;margin:0 auto 20px}
.lock-card h1{font-size:26px;text-align:center}
.lock-card .sub{text-align:center;color:var(--ink-soft);margin:8px 0 24px;font-size:15px}
.lock-card label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field{display:flex;border:1px solid var(--line-firm);border-radius:10px;background:#fff;overflow:hidden}
.field span{padding:12px 10px 12px 14px;color:var(--ink-soft);border-right:1px solid var(--line)}
.field input{border:0;outline:0;flex:1;min-width:0;padding:12px 14px;font-size:18px;letter-spacing:.04em;background:transparent}
.field:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px rgba(8,28,64,.08)}
.remember{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-soft);margin:14px 0 18px}
.btn{display:block;width:100%;border:0;border-radius:10px;background:var(--navy);color:var(--cream);padding:13px 16px;font-weight:600;font-size:16px;cursor:pointer}
.btn[disabled]{opacity:.6;cursor:progress}
.err{color:#9A2B2B;font-size:14px;margin-top:12px;min-height:20px;text-align:center}
.fine{font-size:12.5px;color:var(--ink-faint);text-align:center;margin-top:18px}

/* report */
.top{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.top img{width:96px}
.top .t{flex:1;min-width:0;font-size:13px;color:var(--ink-soft);line-height:1.3}
.top .t b{display:block;color:var(--navy);font-size:15px}
.lockbtn{border:1px solid var(--line-firm);background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
nav.jump{background:var(--paper);border-bottom:1px solid var(--line)}
nav.jump .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:8px;padding-bottom:8px;scrollbar-width:none}
nav.jump a{white-space:nowrap;font-size:13px;color:var(--ink);text-decoration:none;padding:5px 10px;border-radius:99px;border:1px solid var(--line)}
nav.jump a:hover{border-color:var(--maroon)}

.hero{background:var(--ledger);color:var(--ledger-ink);padding:36px 0 32px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.hero .eyebrow{color:var(--gold)}
.hero h1{color:var(--ledger-ink);font-size:clamp(40px,10vw,64px);margin:6px 0 6px;letter-spacing:-.01em}
.hero .lede{color:rgba(241,233,216,.82);max-width:640px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}
.tile{background:var(--ledger-2);border-radius:12px;padding:14px 16px}
.tile .k{font-size:12.5px;color:rgba(241,233,216,.72)}
.tile .v{font-family:var(--f-display);font-size:26px;color:var(--ledger-ink);margin-top:2px}
.tile .s{font-size:12.5px;color:rgba(241,233,216,.62);margin-top:2px}
.short{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 20px 18px;margin-top:-1px}
.short h2{font-size:20px;margin-bottom:10px}
.short ul{margin:0;padding-left:20px}
.short li{margin:6px 0}

section.sec{padding:40px 0 8px}
.sec-head{border-left:3px solid var(--maroon);padding-left:12px;margin-bottom:18px}
.sec-head .eyebrow{color:var(--maroon)}
.sec-head h2{font-size:clamp(24px,5vw,30px);margin-top:2px}
.sec-head p{color:var(--ink-soft);margin-top:6px;max-width:680px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.card h3{font-size:18px;margin-bottom:4px}
.card .note{font-size:13.5px;color:var(--ink-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stat-row{display:flex;flex-wrap:wrap;gap:24px;margin:8px 0 4px}
.stat .k{font-size:12.5px;color:var(--ink-soft)}
.stat .v{font-family:var(--f-display);font-size:24px;color:var(--navy)}

/* split bar */
.split{display:flex;height:26px;gap:2px;margin:16px 0 10px}
.split div{height:100%;min-width:2px}
.split div:first-child{border-radius:4px 0 0 4px}
.split div:last-child{border-radius:0 4px 4px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--ink)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.flow > div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--cream)}
.flow .k{font-size:12px;color:var(--ink-soft)}
.flow .v{font-weight:600;color:var(--navy)}

/* bars */
.bars{margin-top:14px}
.bar{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:10px;padding:5px 0;cursor:default}
.bar .lab{font-size:14px}
.bar .lab small{display:block;color:var(--ink-faint);font-size:12px;line-height:1.2}
.bar .track{height:14px;position:relative}
.bar .fill{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.bar .val{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;min-width:72px}
.bar:hover .fill,.bar:focus .fill{filter:brightness(1.12)}

/* column chart */
.cols{display:flex;align-items:flex-end;gap:6px;height:190px;margin-top:18px;border-bottom:1px solid var(--line-firm);position:relative}
.col{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;position:relative}
.col span{display:block;width:100%;max-width:18px;border-radius:4px 4px 0 0;min-height:1px}
.col-labels{display:flex;gap:6px;margin-top:6px}
.col-labels div{flex:1;min-width:0;text-align:center;font-size:11.5px;color:var(--ink-soft)}
.col{min-width:0}
.ms{display:none}
.gridline{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:11px;color:var(--ink-faint)}
.gridline em{position:absolute;top:-16px;left:0;font-style:normal}
.scen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.scen > div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--cream)}
.scen .k{font-size:12px;color:var(--ink-soft)}
.scen .v{font-family:var(--f-display);font-size:22px;color:var(--navy)}
.scen .mid{border-color:var(--you);background:#EEF2FA}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:12px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--paper)}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--ink-soft);font-weight:600;background:var(--cream);position:sticky;top:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;border-top:1px solid var(--line-firm)}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--good-bg);color:var(--good-fg)}
.pill.wait{background:var(--warn-bg);color:var(--warn-fg)}
.pill.info{background:#E7ECF5;color:#2B4672}
details.more{margin-top:12px}
details.more summary{cursor:pointer;color:var(--maroon);font-weight:600;font-size:14.5px}

/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--sand)}
.tl li{position:relative;padding:0 0 18px 30px}
.tl li:before{content:"";position:absolute;left:1px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:3px solid var(--maroon)}
.tl .d{font-size:12px;color:var(--ink-faint);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tl .h{font-weight:700;color:var(--navy)}
.tl .x{color:var(--ink-soft);font-size:14.5px}

.roles ul{margin:8px 0 0;padding-left:18px}
.roles li{margin:5px 0;font-size:14.5px}
.roles .card{border-top:3px solid var(--you)}
.roles .card.av{border-top-color:var(--avira)}

.next{list-style:none;margin:0;padding:0}
.next li{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.next li:last-child{border-bottom:0}
.next .w{font-weight:700;color:var(--maroon);font-size:14px}
.asks li{margin:6px 0}

footer{padding:28px 0 48px;color:var(--ink-soft);font-size:13.5px}
footer p{margin-top:6px}

#tip{position:fixed;z-index:20;pointer-events:none;background:var(--navy);color:var(--cream);font-size:12.5px;padding:7px 10px;border-radius:8px;max-width:240px;line-height:1.35;opacity:0;transition:opacity .12s;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#tip.on{opacity:1}

@media (max-width:720px){
  .tiles{grid-template-columns:1fr}
  .tile{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .tile .v{font-size:22px}
  .tile .s{display:none}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flow > div{padding:8px 10px}
  .scen{grid-template-columns:1fr}
  .bar{grid-template-columns:78px 1fr auto}
  .next li{grid-template-columns:1fr;gap:2px}
  .col span{max-width:12px}
  .col-labels div{font-size:10px}
}
@media (max-width:480px){
  .hm{display:none}
  .ml{display:none}.ms{display:inline}
  .cols,.col-labels{gap:3px}
  th,td{padding:8px 7px}
  .top img{width:80px}
  .top .t b{font-size:14px}
}
@media print{.top,nav.jump,.lockbtn{display:none}.hero{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="tip" role="tooltip"></div>

<main id="lock" class="lock" hidden>
  <div class="lock-card">
    <img src="../img/logo-avira-stays.svg" width="889" height="371" alt="Avira Stays">
    <h1>Owner report</h1>
    <p class="sub">For the property owners we manage. Enter your mobile number to open it.</p>
    <form id="form" autocomplete="off">
      <label for="num">Mobile number</label>
      <div class="field"><span>+91</span><input id="num" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="10-digit number" maxlength="16" required></div>
      <label class="remember"><input type="checkbox" id="rem" checked> Keep me signed in on this phone</label>
      <button class="btn" id="go" type="submit">Open report</button>
      <p class="err" id="err" aria-live="polite"></p>
    </form>
    <p class="fine">Your number only unlocks this page on your own phone. It is not sent anywhere.</p>
  </div>
</main>

<div id="app" hidden></div>

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ym = s => { const [y,m] = s.split('-'); return MON[+m-1] + ' ' + y; };
const ymLong = s => { const [y,m] = s.split('-'); return ['January','February','March','April','May','June','July','August','September','October','November','December'][+m-1] + ' ' + y; };
const dmy = s => { if(!s) return ''; const [y,m,d] = s.split('-'); return (+d) + ' ' + MON[+m-1]; };
const dmyY = s => { if(!s) return ''; const [y,m,d] = s.split('-'); return (+d) + ' ' + MON[+m-1] + ' ' + y; };

/* ---------- unlock ---------- */
const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(number){
  const n = number.replace(/\D/g,'').slice(-10);
  if (n.length < 10) throw new Error('short');
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(n), 'PBKDF2', false, ['deriveKey']);
  for (const k of LOCKED.keys){
    try{
      const kek = await crypto.subtle.deriveKey({name:'PBKDF2', salt:ub(k.salt), iterations:LOCKED.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
      const raw = await crypto.subtle.decrypt({name:'AES-GCM', iv:ub(k.iv)}, kek, ub(k.wrapped));
      const ck = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:ub(LOCKED.iv)}, ck, ub(LOCKED.data));
      return {data: JSON.parse(new TextDecoder().decode(plain)), n};
    }catch(e){ /* not this key */ }
  }
  throw new Error('nomatch');
}
function store(get, val){
  try{ if(get) return localStorage.getItem(STORE); if(val===null) localStorage.removeItem(STORE); else localStorage.setItem(STORE, val); }catch(e){ return null; }
}
function showLock(msg){
  $('#app').hidden = true; $('#lock').hidden = false;
  $('#err').textContent = msg || '';
  setTimeout(()=>$('#num').focus(), 50);
}
async function boot(){
  if (OPEN) return render(OPEN);
  if (!window.crypto || !crypto.subtle){ showLock('Please open this page at https://aviraestates.com/partner/'); $('#go').disabled = true; return; }
  const saved = store(true);
  if (saved){
    try{ const r = await unlock(saved); return render(r.data); }catch(e){ store(false, null); }
  }
  showLock();
}
$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#go'); btn.disabled = true; btn.textContent = 'Opening…'; $('#err').textContent = '';
  try{
    const r = await unlock($('#num').value);
    if ($('#rem').checked) store(false, r.n);
    render(r.data);
  }catch(err){
    $('#err').textContent = err.message === 'short' ? 'Please enter all 10 digits.' : 'That number doesn’t have access. Check it, or ask in the group.';
  }finally{ btn.disabled = false; btn.textContent = 'Open report'; }
});

/* ---------- tooltip ---------- */
const tip = $('#tip');
function bindTips(root){
  root.querySelectorAll('[data-tip]').forEach(el => {
    el.tabIndex = el.tabIndex >= 0 ? el.tabIndex : 0;
    const show = ev => {
      tip.innerHTML = el.dataset.tip; tip.classList.add('on');
      const r = el.getBoundingClientRect();
      const x = Math.min(Math.max(8, (ev && ev.clientX ? ev.clientX : r.left + r.width/2) - tip.offsetWidth/2), innerWidth - tip.offsetWidth - 8);
      const y = (ev && ev.clientY ? ev.clientY : r.top) - tip.offsetHeight - 12;
      tip.style.left = x + 'px'; tip.style.top = Math.max(8, y) + 'px';
    };
    el.addEventListener('mousemove', show); el.addEventListener('focus', () => show());
    el.addEventListener('click', show);
    el.addEventListener('mouseleave', () => tip.classList.remove('on'));
    el.addEventListener('blur', () => tip.classList.remove('on'));
  });
  addEventListener('scroll', () => tip.classList.remove('on'), {passive:true});
}

/* ---------- render ---------- */
function hbars(rows, color, fmt, max){
  max = max || Math.max(...rows.map(r => r.value), 1);
  return '<div class="bars">' + rows.map(r =>
    `<div class="bar" data-tip="${esc(r.tip)}"><div class="lab">${esc(r.label)}${r.sub ? `<small>${esc(r.sub)}</small>` : ''}</div>
      <div class="track"><div class="fill" style="width:${(r.value/max*100).toFixed(1)}%;background:${color}"></div></div>
      <div class="val">${fmt(r.value)}</div></div>`).join('') + '</div>';
}

function render(D){
  const C = D.content, T = D.total, O = D.occupancy;
  const asof = dmyY(D.asof);
  const first = dmy(O.from);
  const B = D.bookings;
  const stays = B.filter(b => b.kind === 'stay');
  const dueFuture = B.filter(b => b.in > D.asof).reduce((s,b) => s + b.due, 0);
  const duePast = T.due - dueFuture;
  const rooms = [...D.rooms].sort((a,b) => b.net - a.net);
  const top2 = rooms.slice(0,2), top2share = (top2[0].net + top2[1].net) / T.net;
  const months = D.months;
  const occM = O.months;

  // plan vs actual
  const plan = D.forecast.plan;
  const actual = D.owner_by_stay_month;
  const chartMonths = [...new Set([...Object.keys(actual), ...plan.map(p => p.month)])].sort();
  const planBy = Object.fromEntries(plan.map(p => [p.month, p.owner]));
  const cmax = Math.max(...chartMonths.map(m => Math.max(planBy[m] || 0, actual[m] || 0)));
  const step = cmax > 300000 ? 100000 : 50000;
  const gl = []; for (let v = step; v < cmax; v += step) gl.push(v);
  const curMonth = D.asof.slice(0,7);
  const sc = D.forecast.scenarios;

  const statusPill = b => {
    if (b.status === 'Relocated') return '<span class="pill info">Moved (overbooked)</span>';
    if (b.status === 'To confirm') return '<span class="pill wait">To confirm</span>';
    if (b.in > D.asof) return '<span class="pill info">Upcoming</span>';
    return b.due > 0 ? '<span class="pill wait">Payout due</span>' : '<span class="pill ok">Paid in</span>';
  };

  const html = `
  <header class="top"><div class="wrap">
    <img src="../img/logo-avira-stays.svg" width="889" height="371" alt="Avira Stays">
    <div class="t"><b>Owner report · ${esc(C.property)}</b>Figures to ${asof} · refreshed weekly</div>
    <button class="lockbtn" id="lockbtn" type="button">Sign out</button>
  </div></header>
  <nav class="jump" aria-label="Sections"><div class="wrap">
    <a href="#split">80:20 split</a><a href="#sources">Where it comes from</a><a href="#occupancy">Occupancy</a>
    <a href="#stays">Every stay</a><a href="#done">What we’ve done</a><a href="#roles">Who does what</a>
    <a href="#ahead">The year ahead</a><a href="#next">Next steps</a>
  </div></nav>

  <section class="hero"><div class="wrap">
    <p class="eyebrow">Your 80% so far</p>
    <h1 class="num">${inr(T.owner)}</h1>
    <p class="lede">From ${T.nights} room-nights across ${stays.length} stays, ${first} to ${asof}, after every platform fee and tax. Avira Stays’ 20% on the same money is ${inr(T.avira)}.</p>
    <div class="tiles">
      <div class="tile"><div class="k">Paid into your account</div><div class="v num">${inr(T.received)}</div><div class="s">From guests and the platforms, to date</div></div>
      <div class="tile"><div class="k">Not yet logged as received</div><div class="v num">${inr(T.due)}</div><div class="s">Includes payouts that may already be in your account but aren’t on our record yet</div></div>
      <div class="tile"><div class="k">Already booked ahead</div><div class="v num">${inr(D.ahead.owner)}</div><div class="s">Your 80% on ${D.ahead.nights} nights not yet stayed</div></div>
    </div>
  </div></section>

  <div class="wrap">
    <div class="short">
      <h2>In short</h2>
      <ul>
        <li>Guests paid <b>${inr(T.gross)}</b>. After platform fees and tax, <b>${inr(T.net)}</b> came to the property: <b>${inr(T.owner)}</b> to you and ${inr(T.avira)} to Avira Stays.</li>
        <li>Each room-night has earned <b>${inr(T.net / T.nights)}</b> net on average. ${esc(top2[0].room)} and ${esc(top2[1].room === 'Studio' ? 'the Studio' : top2[1].room)} bring in ${pct(top2share)} of the money so far.</li>
        <li>${inr(T.received)} is logged as received in your account. The other ${inr(T.due)} is not on our record as received yet: ${inr(duePast)} is for stays already completed or under way (Airbnb usually pays a day after check-in, so much of this has likely arrived and only needs to be matched to your statement), and ${inr(dueFuture)} is for stays still ahead.</li>
        <li>${O.sold} of ${O.available} available room-nights were sold between ${first} and ${asof} (${pct(O.rate)}). ${occM.length > 1 ? `${ymLong(occM[occM.length-1].month).split(' ')[0]} is running at ${pct(occM[occM.length-1].sold/occM[occM.length-1].nights)}, up from ${pct(occM[0].sold/occM[0].nights)} in ${ymLong(occM[0].month).split(' ')[0]}.` : ''} The new prices and listings went live on 9 and 10 Oct, so most of this period ran on the old setup.</li>
      </ul>
    </div>

    <section class="sec" id="split">
      <div class="sec-head"><p class="eyebrow">01 · The 80:20 split</p><h2>Where every rupee went</h2>
        <p>${esc(C.model_line)}</p></div>
      <div class="card">
        <h3>From the guest’s payment to your 80%</h3>
        <div class="split" role="img" aria-label="Platform fees ${inr(T.fees)}, your share ${inr(T.owner)}, Avira Stays ${inr(T.avira)}">
          <div style="flex:${T.fees};background:var(--fees)" data-tip="Platform fees and tax: ${inr(T.fees)} (${pct(T.fees/T.gross)} of what guests paid)"></div>
          <div style="flex:${T.owner};background:var(--you)" data-tip="Your 80%: ${inr(T.owner)}"></div>
          <div style="flex:${T.avira};background:var(--avira)" data-tip="Avira Stays 20%: ${inr(T.avira)}"></div>
        </div>
        <div class="legend"><span><i style="background:var(--fees)"></i>Platform fees and tax ${inr(T.fees)}</span><span><i style="background:var(--you)"></i>You, 80% ${inr(T.owner)}</span><span><i style="background:var(--avira)"></i>Avira Stays, 20% ${inr(T.avira)}</span></div>
        <div class="flow">
          <div><div class="k">Guests paid</div><div class="v num">${inr(T.gross)}</div></div>
          <div><div class="k">Fees and tax</div><div class="v num">− ${inr(T.fees)}</div></div>
          <div><div class="k">Net to property</div><div class="v num">${inr(T.net)}</div></div>
          <div><div class="k">Your 80%</div><div class="v num">${inr(T.owner)}</div></div>
        </div>
        <p class="note" style="margin-top:12px">Airbnb keeps 15.5% plus 5% tax withheld. MakeMyTrip keeps 18% commission plus GST on it and 0.1% TDS. Direct bookings carry no fee. The 80:20 runs on what is left.</p>
      </div>
      <div class="card">
        <h3>Month by month</h3>
        <p class="note">Settled in the month a guest checks out, which is when the platforms release the money.</p>
        <div class="tbl-wrap"><table>
          <thead><tr><th>Month</th><th class="r hm">Bookings</th><th class="r hm">Nights</th><th class="r">Net</th><th class="r">You, 80%</th><th class="r">Avira, 20%</th><th class="r">Paid in</th><th class="r">To come</th></tr></thead>
          <tbody>${months.map(m => `<tr><td>${ymLong(m.month)}${m.month > curMonth ? ' <span class="pill info">booked</span>' : ''}</td><td class="r hm">${m.bookings}</td><td class="r hm">${m.nights}</td><td class="r">${inr(m.net)}</td><td class="r">${inr(m.owner)}</td><td class="r">${inr(m.avira)}</td><td class="r">${inr(m.received)}</td><td class="r">${inr(m.due)}</td></tr>`).join('')}
          <tr class="total"><td>Total</td><td class="r hm">${T.bookings}</td><td class="r hm">${T.nights}</td><td class="r">${inr(T.net)}</td><td class="r">${inr(T.owner)}</td><td class="r">${inr(T.avira)}</td><td class="r">${inr(T.received)}</td><td class="r">${inr(T.due)}</td></tr></tbody>
        </table></div>
        <p class="note" style="margin-top:10px">The first monthly statement, for October, comes on 1 November, checked against every Airbnb and MakeMyTrip payout. Avira Stays’ 20% is settled from that statement.</p>
      </div>
    </section>

    <section class="sec" id="sources">
      <div class="sec-head"><p class="eyebrow">02 · Where it comes from</p><h2>By platform and by room</h2>
        <p>Net payout to the property, after fees. Tap a bar for the detail.</p></div>
      <div class="grid2">
        <div class="card"><h3>By platform</h3>
          ${hbars(D.platforms.map(p => ({label: p.platform === 'MakeMyTrip' ? 'MMT' : p.platform, sub: p.nights + ' nights', value: p.net,
             tip: `<b>${esc(p.platform)}</b><br>${p.bookings} bookings · ${p.nights} nights<br>Guests paid ${inr(p.gross)}<br>Fees ${inr(p.fees)} · net ${inr(p.net)}<br>Your 80%: ${inr(p.owner)}`})), 'var(--navy)', v => inr(v))}
          <p class="note" style="margin-top:10px">MMT is MakeMyTrip. Direct means bookings taken by the Avira Stays desk and paid straight to you, including late check-outs and extensions.</p>
        </div>
        <div class="card"><h3>By room</h3>
          ${hbars(rooms.map(r => ({label: r.room, sub: r.nights + ' nights', value: r.net,
             tip: `<b>${esc(r.room)}</b><br>${r.bookings} bookings · ${r.nights} nights<br>Net ${inr(r.net)} · avg ${inr(r.avg)}/night<br>Your 80%: ${inr(r.owner)}`})), 'var(--navy)', v => inr(v))}
        </div>
      </div>
    </section>

    <section class="sec" id="occupancy">
      <div class="sec-head"><p class="eyebrow">03 · Occupancy</p><h2>How full the rooms have been</h2>
        <p>Nights sold out of nights available, ${first} to ${asof}. A guest moved to another property because of the 2 Oct overbooking is not counted as a night in the room.</p></div>
      <div class="grid2">
        <div class="card"><h3>All seven spaces</h3>
          <div class="stat-row"><div class="stat"><div class="k">Room-nights sold</div><div class="v num">${O.sold} of ${O.available}</div></div><div class="stat"><div class="k">Occupancy</div><div class="v num">${pct(O.rate)}</div></div></div>
          ${hbars(occM.map(m => ({label: ym(m.month), sub: dmy(m.from) + '–' + dmy(m.to), value: m.sold/m.nights,
             tip: `<b>${ymLong(m.month)}</b> (${dmy(m.from)} to ${dmy(m.to)})<br>${m.sold} of ${m.nights} room-nights sold`})), 'var(--occ)', v => pct(v), 1)}
        </div>
        <div class="card"><h3>By room</h3>
          ${hbars(O.rooms.map(r => ({label: r.room, value: r.rate, tip: `<b>${esc(r.room)}</b><br>${r.sold} of ${r.nights} nights sold`})), 'var(--occ)', v => pct(v), Math.max(...O.rooms.map(r => r.rate), .01))}
        </div>
      </div>
    </section>

    <section class="sec" id="stays">
      <div class="sec-head"><p class="eyebrow">04 · Every stay</p><h2>Each booking, line by line</h2>
        <p>Checked against Airbnb and MakeMyTrip. Guest names stay off this page.</p></div>
      <div class="card">
        <div class="stat-row">
          <div class="stat"><div class="k">Stays</div><div class="v num">${stays.length}</div></div>
          <div class="stat"><div class="k">Extras (late check-outs)</div><div class="v num">${B.length - stays.length}</div></div>
          <div class="stat"><div class="k">Still to confirm</div><div class="v num">${D.open_rows}</div></div>
        </div>
        <details class="more"><summary>Show all ${B.length} lines</summary>
          <div class="tbl-wrap"><table>
            <thead><tr><th>Dates</th><th>Room</th><th>Platform</th><th class="r">Nights</th><th class="r">Net</th><th class="r">You, 80%</th><th>Status</th></tr></thead>
            <tbody>${B.map(b => `<tr><td>${dmy(b.in)}${b.out && b.out !== b.in ? '–' + dmy(b.out) : ''}${b.kind === 'extra' ? ' <span class="pill info">extra</span>' : ''}</td><td>${esc(b.room)}</td><td>${esc(b.platform === 'MakeMyTrip' ? 'MMT' : b.platform)}</td><td class="r">${b.nights || '–'}</td><td class="r">${b.net ? inr(b.net) : '–'}</td><td class="r">${b.owner ? inr(b.owner) : '–'}</td><td>${statusPill(b)}</td></tr>`).join('')}</tbody>
          </table></div>
        </details>
      </div>
    </section>

    <section class="sec" id="done">
      <div class="sec-head"><p class="eyebrow">05 · Progress</p><h2>What we’ve done for the property</h2>
        <p>The work behind the numbers, in order.</p></div>
      <div class="card"><ul class="tl">${C.done.map(x => `<li><div class="d">${esc(x.date)}</div><div class="h">${esc(x.title)}</div><div class="x">${esc(x.text)}</div></li>`).join('')}</ul></div>
    </section>

    <section class="sec roles" id="roles">
      <div class="sec-head"><p class="eyebrow">06 · Who does what</p><h2>Roles under the 80:20</h2></div>
      <div class="grid2">
        <div class="card av"><h3>${esc(C.roles.avira.title)}</h3><ul>${C.roles.avira.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
        <div class="card"><h3>${esc(C.roles.owner.title)}</h3><ul>${C.roles.owner.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>
      </div>
    </section>

    <section class="sec" id="ahead">
      <div class="sec-head"><p class="eyebrow">07 · The year ahead</p><h2>What the price plan points to</h2>
        <p>Your 80% by month under the 12-month plan you approved on 9 Oct, with what has actually been earned so far set against it. This is an estimate, not a promise: it rests on occupancy assumptions for a first season.</p></div>
      <div class="card">
        <div class="legend"><span><i style="background:var(--you-soft)"></i>Plan, expected case</span><span><i style="background:var(--you)"></i>Earned so far (by the month of the stay)</span></div>
        <div class="cols" role="img" aria-label="Monthly plan against actual earnings">
          ${gl.map(v => `<div class="gridline" style="bottom:${(v/cmax*100).toFixed(1)}%"><em>${lakh(v).replace(' lakh','L')}</em></div>`).join('')}
          ${chartMonths.map(m => `<div class="col" data-tip="<b>${ymLong(m)}</b>${planBy[m] ? '<br>Plan: ' + inr(planBy[m]) : ''}${actual[m] ? '<br>Earned so far: ' + inr(actual[m]) : ''}${m === '2026-10' ? '<br><i>Plan covers 9–31 Oct only</i>' : ''}">
             ${planBy[m] ? `<span style="height:${(planBy[m]/cmax*100).toFixed(1)}%;background:var(--you-soft)"></span>` : ''}
             ${actual[m] ? `<span style="height:${(actual[m]/cmax*100).toFixed(1)}%;background:var(--you)"></span>` : ''}
           </div>`).join('')}
        </div>
        <div class="col-labels">${chartMonths.map(m => `<div><span class="ml">${MON[+m.slice(5)-1]}</span><span class="ms">${MON[+m.slice(5)-1][0]}</span></div>`).join('')}</div>
        <div class="scen">
          <div><div class="k">Low case, 12 months</div><div class="v">${lakh(sc.low)}</div></div>
          <div class="mid"><div class="k">Expected case, 12 months</div><div class="v">${lakh(sc.expected)}</div></div>
          <div><div class="k">High case, 12 months</div><div class="v">${lakh(sc.high)}</div></div>
        </div>
        <p class="note" style="margin-top:12px">December and New Year carry the season. October’s plan only starts on 9 Oct, and “earned so far” only counts bookings recorded up to ${asof}. Running costs are not taken out of these figures.</p>
      </div>
    </section>

    <section class="sec" id="next">
      <div class="sec-head"><p class="eyebrow">08 · Next steps</p><h2>What happens next</h2></div>
      <div class="card"><ul class="next">${C.next.map(x => `<li><div class="w">${esc(x.when)}</div><div>${esc(x.what)}</div></li>`).join('')}</ul></div>
      <div class="card"><h3>What we need from you</h3><ul class="asks">${C.asks.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
    </section>
  </div>

  <footer><div class="wrap">
    <p>${esc(C.contact_line)}</p>
    <p>Figures come from the Avira Stays booking tracker, to ${asof}, matched to Airbnb and MakeMyTrip. Page updated ${esc(D.built)}.</p>
  </div></footer>`;

  const app = $('#app');
  app.innerHTML = html; app.hidden = false; $('#lock').hidden = true;
  bindTips(app);
  $('#lockbtn').addEventListener('click', () => { store(false, null); location.reload(); });
  window.scrollTo(0,0);
}
boot();
</script>
</body>
</html>
