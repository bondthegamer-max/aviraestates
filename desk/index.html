<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>Team desk · Avira Stays</title>
<!-- The Avira Stays team desk runs on Cloudflare (Stays Desk/ in the Avira folder); this page only forwards to it. Team members sign in there with their mobile number. -->
<meta http-equiv="refresh" content="0; url=https://avira-stays-desk.arya-harshit04.workers.dev/">
<style>
:root{--navy:#081C40;--ink:#2D3F4D;--ink-soft:#5E6F7A;--star:#EF923A;--bg:#F7F1E4;--paper:#FFFDF8;--line:rgba(45,63,77,.14)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}
.wrap{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;max-width:400px;width:100%;padding:32px 24px;text-align:center;box-shadow:0 12px 40px rgba(8,28,64,.08)}
.card img{width:170px;margin:0 auto 20px}
h1{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;color:var(--navy);font-size:24px;font-weight:600;margin:0 0 8px}
p{margin:0 0 20px;color:var(--ink-soft);font-size:15px}
a.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;border-radius:10px;padding:12px 20px;font-weight:600;white-space:nowrap}
a.btn:focus-visible{outline:2px solid var(--star);outline-offset:2px}
</style>
</head>
<body>
<main class="wrap">
  <div class="card">
    <img src="../img/logo-avira-stays.svg" width="889" height="371" alt="Avira Stays">
    <h1>Team desk</h1>
    <p>Opening the team desk. Sign in with your mobile number.</p>
    <a class="btn" href="https://avira-stays-desk.arya-harshit04.workers.dev/">Open the desk</a>
  </div>
</main>
<script>location.replace("https://avira-stays-desk.arya-harshit04.workers.dev/");</script>
</body>
</html>
